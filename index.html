<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapa Nova Era - Ouvidoria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #05030a;
      background-image: 
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.35), transparent 45%),
        radial-gradient(circle at bottom right, rgba(147, 51, 234, 0.35), transparent 45%);
      background-attachment: fixed;
      color: #f3f4f6;
    }
    .custom-frame {
      border: 3px solid transparent;
      background-image: linear-gradient(#0f0a1c, #0f0a1c), 
                        radial-gradient(circle at top left, #c084fc, #7e22ce, #3b0764);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans p-4 md:p-8">

  <!-- Cabeçalho -->
  <header class="max-w-3xl mx-auto w-full text-center my-6">
    <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-purple-400 to-indigo-300 drop-shadow-md">
      CHAPA NOVA ERA
    </h1>
    <p class="text-purple-200 mt-2 text-lg">Fala Estudante - A sua voz faz a diferença!</p>
  </header>

  <!-- Formulário Principal -->
  <main class="max-w-2xl mx-auto w-full">
    <div class="custom-frame rounded-2xl p-6 md:p-10 backdrop-blur-md">
      <h2 class="text-2xl font-bold mb-6 text-purple-100 flex items-center gap-2">
        <i data-lucide="message-square-plus" class="text-purple-400"></i>
        Envie sua sugestão ou recado
      </h2>

      <form id="ouvidoriaForm" class="space-y-5">
        
        <!-- Categoria -->
        <div>
          <label class="block text-sm font-medium text-purple-200 mb-1">Tipo de Mensagem</label>
          <select id="tipo" required class="w-full bg-purple-950/60 border border-purple-500/40 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-400 outline-none">
            <option value="Sugestão">💡 Sugestão</option>
            <option value="Crítica">⚠️ Crítica / Reclamação</option>
            <option value="Elogio">⭐ Elogio</option>
            <option value="Dúvida">❓ Dúvida</option>
          </select>
        </div>

        <!-- Dados do Aluno -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-purple-200 mb-1">Nome (Opcional)</label>
            <input type="text" id="nome" placeholder="Anônimo" class="w-full bg-purple-950/60 border border-purple-500/40 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-400 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-purple-200 mb-1">Ano / Série</label>
            <select id="ano" required class="w-full bg-purple-950/60 border border-purple-500/40 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-400 outline-none">
              <option value="6º">6º Ano</option>
              <option value="7º">7º Ano</option>
              <option value="8º">8º Ano</option>
              <option value="9º">9º Ano</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-purple-200 mb-1">Turma</label>
            <select id="turma" required class="w-full bg-purple-950/60 border border-purple-500/40 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-400 outline-none">
              <option value="A">Turma A</option>
              <option value="B">Turma B</option>
              <option value="C">Turma C</option>
              <option value="D">Turma D</option>
              <option value="E">Turma E</option>
              <option value="F">Turma F</option>
            </select>
          </div>
        </div>

        <!-- Mensagem -->
        <div>
          <label class="block text-sm font-medium text-purple-200 mb-1">Sua Mensagem</label>
          <textarea id="mensagem" rows="4" required placeholder="Escreva aqui o que você gostaria de ver na nossa escola..." class="w-full bg-purple-950/60 border border-purple-500/40 rounded-lg p-3 text-white focus:ring-2 focus:ring-purple-400 outline-none resize-none"></textarea>
        </div>

        <!-- Botão de Envio -->
        <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3.5 px-6 rounded-lg transition duration-200 shadow-lg shadow-purple-900/50 flex justify-center items-center gap-2">
          <i data-lucide="send"></i>
          Enviar Mensagem
        </button>

      </form>

      <!-- Mensagem de Sucesso -->
      <div id="sucessoMsg" class="hidden mt-4 p-4 bg-purple-900/80 border border-purple-400 text-purple-100 rounded-lg text-center font-medium">
        ✨ Mensagem enviada com sucesso! A Chapa Nova Era agradece a sua participação.
      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="text-center text-sm text-purple-400/70 my-6">
    © 2026 Chapa Nova Era • Juntos por uma escola melhor!
  </footer>

  <script>
    lucide.createIcons();

    const channel = new BroadcastChannel('nova_era_ouvidoria');

    document.getElementById('ouvidoriaForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const dados = {
        id: Date.now(),
        tipo: document.getElementById('tipo').value,
        nome: document.getElementById('nome').value || 'Anônimo',
        ano: document.getElementById('ano').value,
        turma: document.getElementById('turma').value,
        mensagem: document.getElementById('mensagem').value,
        data: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      };

      // Guardar no localStorage
      const msgsAntigas = JSON.parse(localStorage.getItem('mensagens_ouvidoria') || '[]');
      msgsAntigas.unshift(dados);
      localStorage.setItem('mensagens_ouvidoria', JSON.stringify(msgsAntigas));

      // Notificar abas abertas
      channel.postMessage(dados);

      // Limpar formulário e exibir confirmação
      document.getElementById('ouvidoriaForm').reset();
      const msgBox = document.getElementById('sucessoMsg');
      msgBox.classList.remove('hidden');

      setTimeout(() => {
        msgBox.classList.add('hidden');
      }, 4000);
    });
  </script>
</body>
</html>
