<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Chapa Nova Era</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #05030a;
      background-image: 
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.35), transparent 45%),
        radial-gradient(circle at bottom right, rgba(147, 51, 234, 0.35), transparent 45%);
      background-attachment: fixed;
      color: #f3f4f6;
    }
    .custom-frame {
      border: 3px solid transparent;
      background-image: linear-gradient(#0f0a1c, #0f0a1c), 
                        radial-gradient(circle at top left, #c084fc, #7e22ce, #3b0764);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">

  <header class="max-w-5xl mx-auto mb-8 flex justify-between items-center border-b border-purple-800/50 pb-4">
    <div>
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-indigo-300">
        PAINEL ADMINISTRATIVO
      </h1>
      <p class="text-sm text-purple-300">Gestão de Ouvidoria - Chapa Nova Era</p>
    </div>
    <button onclick="limparTodas()" class="bg-red-950/60 border border-red-500/40 hover:bg-red-900/80 text-red-200 px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition">
      <i data-lucide="trash-2" class="w-4 h-4"></i>
      Limpar Tudo
    </button>
  </header>

  <main class="max-w-5xl mx-auto">
    <div class="custom-frame rounded-2xl p-6 backdrop-blur-md">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-purple-100 flex items-center gap-2">
          <i data-lucide="inbox" class="text-purple-400"></i>
          Mensagens Recebidas
        </h2>
        <span id="contador" class="bg-purple-900/80 border border-purple-500/40 text-purple-200 px-3 py-1 rounded-full text-xs font-semibold">
          0 Mensagens
        </span>
      </div>

      <div id="listaMensagens" class="space-y-4">
        <!-- As mensagens serão inseridas aqui dinamicamente -->
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const channel = new BroadcastChannel('nova_era_ouvidoria');

    function carregarMensagens() {
      const msgs = JSON.parse(localStorage.getItem('mensagens_ouvidoria') || '[]');
      const container = document.getElementById('listaMensagens');
      const contador = document.getElementById('contador');

      contador.innerText = `${msgs.length} Mensagem${msgs.length !== 1 ? 's' : ''}`;

      if (msgs.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-purple-400/60">
            <i data-lucide="message-square" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
            <p>Nenhuma mensagem recebida ainda.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = msgs.map(m => `
        <div class="bg-purple-950/40 border border-purple-500/30 rounded-xl p-4 transition hover:border-purple-400/60">
          <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2">
              <span class="bg-purple-800/60 text-purple-200 text-xs px-2.5 py-1 rounded-md font-bold border border-purple-500/30">
                ${m.tipo}
              </span>
              <span class="font-semibold text-purple-100">${m.nome}</span>
              <span class="text-xs text-purple-300/70">(${m.ano} ${m.turma})</span>
            </div>
            <span class="text-xs text-purple-400">${m.data}</span>
          </div>
          <p class="text-purple-200 text-sm whitespace-pre-wrap">${m.mensagem}</p>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Escutar novas mensagens em tempo real
    channel.onmessage = () => carregarMensagens();

    function limparTodas() {
      if (confirm('Tem certeza que deseja apagar todas as mensagens?')) {
        localStorage.removeItem('mensagens_ouvidoria');
        carregarMensagens();
      }
    }

    // Carregar na inicialização
    carregarMensagens();
  </script>
</body>
</html>
